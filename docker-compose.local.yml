services:
  app:
    image: infinite-canvas:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NEW_API_URL: ${NEW_API_URL:-http://host.docker.internal:3000}
      NEW_API_CONSOLE_URL: ${NEW_API_CONSOLE_URL:-http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
